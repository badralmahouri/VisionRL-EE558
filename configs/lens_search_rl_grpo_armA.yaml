# Lens-search GRPO — Arm A: pure RL on the base IBQ checkpoint (no SFT).
# Mirrors configs/cof_rl_grpo.yaml structure; key edits:
#  - actor_rollout_ref.model.path = base IBQ ckpt
#  - data.train_files = data_prep/lens_search/rl_train.parquet
#  - tool_config_path = configs/lens_search_tool_config.yaml
#  - reward.custom_reward_function = rewards/lens_search_rl_reward.py
#  - trainer.logger = [console, file] (no W&B)
#  - trainer.total_training_steps = env-overridable (default 50 for smoke)

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/lens_search/rl_fvqa_train.parquet
  val_files: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/lens_search/rl_fvqa_indist_val.parquet
  prompt_key: prompt
  # 5,000-token total budget (Badr 2026-05-21): prompt 2500 + response 2500.
  # FVQA RL prompt max est. 2,233 tokens → 2,500 covers all rows.
  # Verl's max_new_tokens = response_length + prompt_length - len(prompt_ids) = 5000 - len(prompt_ids).
  # Total request always ≤ 5000, never trips sglang's 8192 validator (max_position_embeddings).
  max_prompt_length: 2500
  max_response_length: 2500
  train_batch_size: 64
  return_raw_chat: true
  return_multi_modal_inputs: false
  apply_chat_template_kwargs:
    enable_thinking: true
  filter_overlong_prompts: true
  truncation: right
  custom_cls:
    path: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/apertus_rl_dataset.py
    name: ApertusRLHFDataset

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: /capstor/store/cscs/swissai/infra01/MLLM/ablations/apertus-8b-img-SFT-32nodes-gbs512-mbs1-steps8030-img-text-seqlen8192-s2onlytxtloss/HF
    trust_remote_code: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
  rollout:
    name: sglang
    gpu_memory_utilization: 0.5
    tensor_model_parallel_size: 2
    n: 8
    log_prob_micro_batch_size_per_gpu: 4
    agent:
      agent_loop_config_path: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/configs/apertus_agent_loop.yaml
    multi_turn:
      enable: true
      format: apertus
      # Smoke-tight: 1 lens_search + 1 display_answers + 1 safety buffer.
      max_assistant_turns: 3
      max_parallel_calls: 1
      # FVQA cached results format to ~1,800 chars ≈ 450 tokens; 512 caps just
      # above that. Smaller value keeps room for turn-2 generation budget.
      max_tool_response_length: 512
      tool_response_truncate_side: middle
      tool_config_path: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/configs/lens_search_tool_config.yaml
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

reward:
  reward_manager:
    name: naive

# custom_reward_function MUST be at top level. Verl reads it via
# `config.get("custom_reward_function")` at top level
# (verl/trainer/ppo/reward.py:80). Nesting under `reward:` makes it silently
# None → falls back to default_compute_score → NotImplementedError on unknown
# data_source. Bug surfaced via jobs 2334396 + 2334397 (2026-05-23).
custom_reward_function:
  path: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/rewards/lens_search_rl_reward.py
  name: compute_score

trainer:
  project_name: lens_search_rl_apertus
  experiment_name: apertus8b-lens-search-armA-pureRL
  total_training_steps: ${oc.decode:${oc.env:TOTAL_STEPS,50}}
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 50
  test_freq: 25
  critic_warmup: 0
  logger: [console, file]
  rollout_data_dir: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/slurm/rollout_logs/armA
  default_local_dir: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/checkpoints/apertus8b-lens-search-armA
