defaults:
  - sft_trainer_engine
  - _self_

hydra:
  searchpath:
    - file:///users/${oc.env:USER}/verl-vision/verl/trainer/config

data:
  train_files:
    - /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/lens_search/sft_toolvqa_train.parquet
  val_files:
    - /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/lens_search/sft_toolvqa_val.parquet
  train_batch_size: 32
  micro_batch_size_per_gpu: 1
  max_length: 8192
  truncation: right
  pad_mode: no_padding
  text_key: text
  custom_cls:
    # Reuse CoFSFTDataset — its loss-mask policy (mask tool-response spans
    # following <|tools_suffix|>[) is tool-name-agnostic, so it works for
    # any Apertus chat template that uses the same tool-call markup.
    path: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/data_prep/cof_sft_dataset.py
    name: CoFSFTDataset

model:
  path: /capstor/store/cscs/swissai/infra01/MLLM/ablations/apertus-8b-img-SFT-32nodes-gbs512-mbs1-steps8030-img-text-seqlen8192-s2onlytxtloss/HF
  trust_remote_code: true
  use_remove_padding: true
  enable_gradient_checkpointing: true

optim:
  lr: 1.0e-5
  lr_warmup_steps_ratio: 0.03
  weight_decay: 0.0
  clip_grad: 1.0
  lr_scheduler_type: cosine
  min_lr_ratio: 0.1

engine:
  strategy: fsdp2
  ulysses_sequence_parallel_size: 1

trainer:
  total_epochs: 5
  project_name: apertus-lens-search-sft
  experiment_name: apertus8b-lens-search-sft-toolvqa-bs32-lr1e-5-e5
  default_local_dir: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/checkpoints/apertus8b-lens-search-sft-toolvqa
  # ~2,521 train rows / bs=32 ≈ 79 steps/epoch × 5 epochs ≈ 394 total grad updates.
  # ~25× more rare-token (id 71/72) supervision than the D.7 pass-1 SFT (16 steps on 267 FVQA rows).
  # Save every 40 steps → ckpts at roughly half-epoch boundaries; final ckpt at ~step 394.
  save_freq: 40
  test_freq: -1
  logger: [console, file]
  rollout_data_dir: /capstor/scratch/cscs/${oc.env:USER}/verl-apertus/slurm/rollout_logs
